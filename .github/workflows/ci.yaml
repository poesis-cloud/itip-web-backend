name: itip-web-backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dco:
    name: Verify DCO sign-off
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              commits="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"
              ;;
            push)
              if printf '%s' "${BEFORE_SHA}" | grep -qE '^0+$'; then
                commits="$(git rev-list --no-merges -n 1 "${AFTER_SHA}")"
              else
                commits="$(git rev-list --no-merges "${BEFORE_SHA}..${AFTER_SHA}")"
              fi
              ;;
            *)
              echo "Unsupported event: ${GITHUB_EVENT_NAME}"; exit 0
              ;;
          esac

          if [ -z "${commits}" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          fail=0
          while IFS= read -r sha; do
            [ -z "${sha}" ] && continue
            author_name="$(git show -s --format='%an' "${sha}")"
            author_email="$(git show -s --format='%ae' "${sha}")"
            message="$(git show -s --format='%B' "${sha}")"
            expected="Signed-off-by: ${author_name} <${author_email}>"
            if printf '%s\n' "${message}" | grep -qxF "${expected}"; then
              echo "PASS  ${sha:0:12}  ${expected}"
            elif [ "${author_name}" = "copilot-swe-agent[bot]" ] && [ "${author_email}" = "198982749+Copilot@users.noreply.github.com" ] \
              && printf '%s\n' "${message}" | grep -qi '^Co-authored-by:'; then
              echo "PASS  ${sha:0:12}  Copilot-authored commit carries a human Co-authored-by trailer"
            else
              echo "FAIL  ${sha:0:12}  missing or mismatched Signed-off-by"
              echo "      expected: ${expected}"
              found="$(printf '%s\n' "${message}" | grep -i '^Signed-off-by:' || true)"
              if [ -n "${found}" ]; then
                echo "      found:"
                printf '%s\n' "${found}" | sed 's/^/        /'
              else
                echo "      found:    (no Signed-off-by trailer)"
              fi
              if [ "${author_name}" = "copilot-swe-agent[bot]" ] && [ "${author_email}" = "198982749+Copilot@users.noreply.github.com" ]; then
                coauthors="$(printf '%s\n' "${message}" | grep -i '^Co-authored-by:' || true)"
                if [ -n "${coauthors}" ]; then
                  echo "      co-authored-by:"
                  printf '%s\n' "${coauthors}" | sed 's/^/        /'
                else
                  echo "      co-authored-by: (none)"
                fi
              fi
              fail=1
            fi
          done <<< "${commits}"

          if [ "${fail}" -ne 0 ]; then
            echo ""
            echo "DCO check failed: every commit must carry a Signed-off-by trailer"
            echo "matching its author. Sign off your commits with:"
            echo ""
            echo "    git commit -s"
            echo ""
            echo "To add sign-off to existing commits:"
            echo ""
            echo "    git rebase --signoff <base>"
            echo "    git push --force-with-lease"
            echo ""
            echo "See CONTRIBUTING.md (Developer Certificate of Origin)."
            exit 1
          fi

          echo ""
          echo "All commits carry a valid Signed-off-by trailer."

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itip-web-backend-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/bom.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Get current week (for cache key)
        id: week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      # Cache de la base NVD (~500MB) - évite le retéléchargement à chaque run
      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.owasp/dependency-check-data
          # Clé qui change chaque semaine → refresh hebdo automatique
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ env.WEEK }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-
            owasp-nvd-${{ runner.os }}-
        env:
          WEEK: ${{ steps.week.outputs.week }}

      - name: OWASP dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -uo pipefail

          # dataDirectory pointe vers le cache
          BASE_ARGS="-DdataDirectory=$HOME/.owasp/dependency-check-data -DnvdApiDelay=2000"

          if [ -n "${NVD_API_KEY:-}" ]; then
            BASE_ARGS="$BASE_ARGS -DnvdApiKey=$NVD_API_KEY"
          else
            echo "::warning::NVD_API_KEY absent — scan plus lent et risque de rate-limit."
          fi

          run_check() {
            mvn -B org.owasp:dependency-check-maven:check $BASE_ARGS "$@"
          }

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "OWASP dependency-check attempt ${attempt}/${max_attempts}"
            if run_check; then
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$((attempt * 30))
              echo "Échec, retry dans ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "::warning::OWASP NVD update impossible après ${max_attempts} tentatives — fallback cache local."
          if run_check -DautoUpdate=false; then
            exit 0
          fi

          echo "::error::OWASP dependency-check failed after online retries and local-cache fallback."
          exit 1

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.html

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
