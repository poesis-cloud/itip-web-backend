spring:
  application:
    name: itip-web-backend
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: false
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Seed changesets are tagged "dev"; any other context leaves them out.
    # Not named LIQUIBASE_* because Liquibase reserves that prefix.
    contexts: ${ITIP_LIQUIBASE_CONTEXTS:prod}

itip:
  authorization:
    batch-timeout-ms: ${ITIP_AUTHORIZATION_BATCH_TIMEOUT_MS:8000}
  defman:
    base-url: ${ITIP_DEFMAN_BASE_URL:}
    connect-timeout-ms: ${ITIP_DEFMAN_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${ITIP_DEFMAN_READ_TIMEOUT_MS:10000}
  security:
    permit-all: ${ITIP_SECURITY_PERMIT_ALL:false}
    jwt:
      secret: ${ITIP_SECURITY_JWT_SECRET:}
      expiration-ms: ${ITIP_SECURITY_JWT_EXPIRATION_MS:3600000}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
