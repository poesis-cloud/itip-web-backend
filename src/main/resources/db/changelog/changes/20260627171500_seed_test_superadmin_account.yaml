databaseChangeLog:
  - changeSet:
      id: 20260627171500-001-create-test-superadmin-role
      author: copilot
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: "0"
          sql: SELECT COUNT(1) FROM role WHERE name = 'TEST_SUPERADMIN'
      changes:
        - insert:
            tableName: role
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: name
                  value: TEST_SUPERADMIN
              - column:
                  name: description
                  value: Test role with full privileges
              - column:
                  name: created_at
                  valueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  valueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: 20260627171500-002-create-test-superadmin-account
      author: copilot
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: "0"
          sql: SELECT COUNT(1) FROM account WHERE email = 'test.superadmin@itip.local'
      changes:
        - insert:
            tableName: account
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: email
                  value: test.superadmin@itip.local
              - column:
                  name: password_hash
                  value: $2a$10$aPuFYUQhKhLKRmfUz0hb/utyzGNbC26lcmvXMP0313fW2429I/p5G
              - column:
                  name: full_name
                  value: Test Super Admin
              - column:
                  name: enabled
                  valueBoolean: true
              - column:
                  name: created_at
                  valueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  valueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: 20260627171500-003-assign-all-privileges-to-test-superadmin-role
      author: copilot
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              INSERT INTO role_privilege_assignment (id, role_id, privilege_id, assigned_by, assigned_at, revoked_at)
              SELECT gen_random_uuid(), r.id, p.id, NULL, CURRENT_TIMESTAMP, NULL
              FROM role r
              CROSS JOIN privilege p
              WHERE r.name = 'TEST_SUPERADMIN'
                AND NOT EXISTS (
                  SELECT 1
                  FROM role_privilege_assignment rpa
                  WHERE rpa.role_id = r.id
                    AND rpa.privilege_id = p.id
                );

  - changeSet:
      id: 20260627171500-004-assign-test-superadmin-role-to-account
      author: copilot
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              INSERT INTO account_role_assignment (id, account_id, role_id, assigned_by, assigned_at, expires_at, revoked_at)
              SELECT gen_random_uuid(), a.id, r.id, NULL, CURRENT_TIMESTAMP, NULL, NULL
              FROM account a
              JOIN role r ON r.name = 'TEST_SUPERADMIN'
              WHERE a.email = 'test.superadmin@itip.local'
                AND NOT EXISTS (
                  SELECT 1
                  FROM account_role_assignment ara
                  WHERE ara.account_id = a.id
                    AND ara.role_id = r.id
                    AND ara.revoked_at IS NULL
                );
