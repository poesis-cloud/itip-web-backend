databaseChangeLog:
  - changeSet:
      id: 20260627195500-001-fix-test-superadmin-password-hash
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - changeLogPropertyDefined:
            property: enable.test.superadmin.seed
            value: "true"
        - sqlCheck:
            expectedResult: "1"
            sql: SELECT COUNT(1) FROM account WHERE email = 'test.superadmin@itip.local'
      changes:
        - update:
            tableName: account
            columns:
              - column:
                  name: password_hash
                  value: $2y$10$0yKh.isL.LZibQCMeone2umo.b/WX6MO59wtgYkeVYqtdRpcA49.G
              - column:
                  name: updated_at
                  valueComputed: CURRENT_TIMESTAMP
            where: email = 'test.superadmin@itip.local'
