# Dev-only seed. Runs solely when the "dev" Liquibase context is active.
# Ids are intentionally omitted so PostgreSQL assigns UUIDv7 via uuid_v7().
databaseChangeLog:
- changeSet:
    id: 0003-1-seed-dev-accounts
    author: copilot
    context: dev
    changes:
    - sql:
        splitStatements: false
        sql: |
          INSERT INTO account (email, password_hash, full_name, enabled, created_at, updated_at)
          VALUES
            ('admin@itip.local',    '$2y$10$6fTX6qIj92/jcUL3x3gTku7UEQTojglTjYP5.PHrzINx0A28Lq6Yq', 'ITIP Admin',    true, now(), now()),
            ('reviewer@itip.local', '$2y$10$cPPWfgsLvqM6tpsZWqIZ0.TgFGwaJt/aLfxJNTjBMdIIG5ZsAfvtC', 'ITIP Reviewer', true, now(), now())
          ON CONFLICT (email) DO NOTHING;

          INSERT INTO role (name, system_managed, created_at, updated_at)
          VALUES
            ('ITIP_ADMIN',    true, now(), now()),
            ('ITIP_REVIEWER', true, now(), now()),
            ('ITIP_USER',     true, now(), now())
          ON CONFLICT (name) DO NOTHING;

- changeSet:
    id: 0003-2-seed-dev-privileges
    author: copilot
    context: dev
    changes:
    - sql:
        splitStatements: false
        sql: |
          INSERT INTO capability (
            resource_origin, resource, operation, enabled, system_managed,
            version, created_by, updated_by, created_at, updated_at
          )
          VALUES
            ('ITIP',   'PRIVILEGE',  'READ',    true, true, 0, 'seed', 'seed', now(), now()),
            ('ITIP',   'PRIVILEGE',  'CREATE',  true, true, 0, 'seed', 'seed', now(), now()),
            ('ITIP',   'ACCOUNT',    'READ',    true, true, 0, 'seed', 'seed', now(), now()),
            ('ITIP',   'ACCOUNT',    'CREATE',  true, true, 0, 'seed', 'seed', now(), now()),
            ('ITIP',   'ACCOUNT',    'UPDATE',  true, true, 0, 'seed', 'seed', now(), now()),
            ('ITIP',   'ACCOUNT',    'DISABLE', true, true, 0, 'seed', 'seed', now(), now()),
            ('DEFMAN', 'DEFINITION', 'CREATE',  true, true, 0, 'seed', 'seed', now(), now()),
            ('DEFMAN', 'ASCRIPTION', 'READ',    true, true, 0, 'seed', 'seed', now(), now()),
            ('DEFMAN', 'ASCRIPTION', 'APPROVE', true, true, 0, 'seed', 'seed', now(), now())
          ON CONFLICT (resource_origin, resource, operation) DO NOTHING;

          INSERT INTO policy (
            condition_expression, version, created_by, updated_by, created_at, updated_at
          )
          VALUES
            ('target.authorship.identity != actor.id', 0, 'seed', 'seed', now(), now()),
            ('target.status == "PROPOSED"', 0, 'seed', 'seed', now(), now())
          ON CONFLICT DO NOTHING;

          INSERT INTO capability_policy (capability_id, policy_id)
          SELECT c.id, p.id
          FROM capability c
          JOIN policy p ON p.condition_expression = 'target.authorship.identity != actor.id'
          WHERE (c.resource_origin, c.resource, c.operation) = ('DEFMAN', 'ASCRIPTION', 'APPROVE')
          ON CONFLICT DO NOTHING;

          INSERT INTO privilege (capability_id, version, created_by, updated_by, created_at, updated_at)
          SELECT c.id, 0, 'seed', 'seed', now(), now()
          FROM capability c
          WHERE (c.resource_origin, c.resource, c.operation) IN (
            ('ITIP', 'PRIVILEGE', 'READ'),
            ('ITIP', 'PRIVILEGE', 'CREATE'),
            ('ITIP', 'ACCOUNT', 'READ'),
            ('ITIP', 'ACCOUNT', 'CREATE'),
            ('ITIP', 'ACCOUNT', 'UPDATE'),
            ('ITIP', 'ACCOUNT', 'DISABLE'),
            ('DEFMAN', 'DEFINITION', 'CREATE'),
            ('DEFMAN', 'ASCRIPTION', 'READ'),
            ('DEFMAN', 'ASCRIPTION', 'APPROVE')
          )
          AND NOT EXISTS (
            SELECT 1 FROM privilege existing WHERE existing.capability_id = c.id
          );

          INSERT INTO privilege_policy (privilege_id, policy_id)
          SELECT pr.id, p.id
          FROM privilege pr
          JOIN capability c ON c.id = pr.capability_id
          JOIN policy p ON p.condition_expression = 'target.status == "PROPOSED"'
          WHERE (c.resource_origin, c.resource, c.operation) = ('DEFMAN', 'ASCRIPTION', 'APPROVE')
          ON CONFLICT DO NOTHING;

- changeSet:
    id: 0003-3-seed-dev-assignments
    author: copilot
    context: dev
    changes:
    - sql:
        splitStatements: false
        sql: |
          INSERT INTO role_privilege_assignment (role_id, privilege_id, assigned_at)
          SELECT r.id, p.id, now()
          FROM role r
          JOIN privilege p ON true
          JOIN capability c
            ON c.id = p.capability_id
            AND (c.resource_origin, c.resource, c.operation) IN (
                 ('ITIP', 'PRIVILEGE', 'READ'),
                 ('ITIP', 'PRIVILEGE', 'CREATE'),
                 ('ITIP', 'ACCOUNT', 'READ'),
                 ('ITIP', 'ACCOUNT', 'CREATE'),
                 ('ITIP', 'ACCOUNT', 'UPDATE'),
                 ('ITIP', 'ACCOUNT', 'DISABLE'),
                 ('DEFMAN', 'DEFINITION', 'CREATE')
               )
          WHERE r.name = 'ITIP_ADMIN'
          ON CONFLICT DO NOTHING;

          INSERT INTO role_privilege_assignment (role_id, privilege_id, assigned_at)
          SELECT r.id, p.id, now()
          FROM role r
          JOIN privilege p ON true
          JOIN capability c
            ON c.id = p.capability_id
            AND (c.resource_origin, c.resource, c.operation) IN (
                 ('DEFMAN', 'ASCRIPTION', 'READ'),
                 ('DEFMAN', 'ASCRIPTION', 'APPROVE')
               )
          WHERE r.name = 'ITIP_REVIEWER'
          ON CONFLICT DO NOTHING;

          INSERT INTO account_role_assignment (account_id, role_id, assigned_at)
          SELECT a.id, r.id, now()
          FROM account a
          JOIN role r ON r.name = 'ITIP_ADMIN'
          WHERE a.email = 'admin@itip.local';

          INSERT INTO account_role_assignment (account_id, role_id, assigned_at)
          SELECT a.id, r.id, now()
          FROM account a
          JOIN role r ON r.name = 'ITIP_REVIEWER'
          WHERE a.email = 'reviewer@itip.local';

          INSERT INTO account_role_assignment (account_id, role_id, assigned_at)
          SELECT a.id, r.id, now()
          FROM account a
          JOIN role r ON r.name = 'ITIP_USER'
          WHERE a.email IN ('admin@itip.local', 'reviewer@itip.local')
          ON CONFLICT DO NOTHING;
