        - column: {name: enabled, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
        - column: {name: operation, type: VARCHAR(255), constraints: {nullable: false}}
        - column: {name: resource, type: VARCHAR(255), constraints: {nullable: false}}
        - column: {name: resource_origin, type: VARCHAR(255), constraints: {nullable: false}}
        - column: {name: system_managed, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
        - column: {name: updated_at, type: TIMESTAMP(6) WITH TIME ZONE, constraints: {nullable: false}}
        - column: {name: updated_by, type: VARCHAR(255), constraints: {nullable: false}}
        - column: {name: version, type: BIGINT, constraints: {nullable: false}}
    - createTable:
