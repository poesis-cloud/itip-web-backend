databaseChangeLog:
- changeSet:
    id: 0006-1-seed-dev-capability-policy
    author: copilot
    context: dev
    dbms: postgresql
    changes:
    - sql:
        splitStatements: false
        sql: |
          -- Seeded dev accounts are created disabled with an unusable placeholder hash.
          -- No working credentials are committed; an operator must set a local password
          -- and enable the account explicitly (see README.md "Dev accounts").
          INSERT INTO account (email, password_hash, full_name, enabled, created_at, updated_at)
          VALUES
            ('admin@itip.local', '!disabled', 'ITIP Admin', false, now(), now()),
            ('reviewer@itip.local', '!disabled', 'ITIP Reviewer', false, now(), now())
          ON CONFLICT (email) DO NOTHING;

          INSERT INTO role (name, system_managed, created_at, updated_at)
          VALUES ('ITIP_ADMIN', true, now(), now()), ('ITIP_REVIEWER', true, now(), now())
          ON CONFLICT (name) DO NOTHING;

          INSERT INTO capability (resource_origin, resource, operation, enabled, system_managed, version, created_by, updated_by, created_at, updated_at)
          VALUES
            ('ITIP', 'ACCOUNT', 'READ', true, true, 0, 'seed', 'seed', now(), now()),
            ('ITIP', 'ACCOUNT', 'CREATE', true, true, 0, 'seed', 'seed', now(), now()),
            ('ITIP', 'ACCOUNT', 'UPDATE', true, true, 0, 'seed', 'seed', now(), now()),
            ('ITIP', 'ACCOUNT', 'DISABLE', true, true, 0, 'seed', 'seed', now(), now()),
            ('DEFMAN', 'DEFINITION', 'CREATE', true, true, 0, 'seed', 'seed', now(), now()),
            ('DEFMAN', 'ASCRIPTION', 'READ', true, true, 0, 'seed', 'seed', now(), now()),
            ('DEFMAN', 'ASCRIPTION', 'APPROVE', true, true, 0, 'seed', 'seed', now(), now())
          ON CONFLICT (resource_origin, resource, operation) DO NOTHING;

          INSERT INTO policy (condition_expression, version, created_by, updated_by, created_at, updated_at)
          SELECT 'target.authorship.identity != actor.id', 0, 'seed', 'seed', now(), now()
          WHERE NOT EXISTS (SELECT 1 FROM policy WHERE condition_expression = 'target.authorship.identity != actor.id');
          INSERT INTO policy (condition_expression, version, created_by, updated_by, created_at, updated_at)
          SELECT 'target.status == "PROPOSED"', 0, 'seed', 'seed', now(), now()
          WHERE NOT EXISTS (SELECT 1 FROM policy WHERE condition_expression = 'target.status == "PROPOSED"');

          INSERT INTO capability_policy (capability_id, policy_id)
          SELECT c.id, p.id FROM capability c JOIN policy p ON p.condition_expression = 'target.authorship.identity != actor.id'
          WHERE (c.resource_origin, c.resource, c.operation) = ('DEFMAN', 'ASCRIPTION', 'APPROVE') ON CONFLICT DO NOTHING;

          INSERT INTO privilege (capability_id, version, created_by, updated_by, created_at, updated_at)
          SELECT c.id, 0, 'seed', 'seed', now(), now() FROM capability c
          WHERE NOT EXISTS (SELECT 1 FROM privilege p WHERE p.capability_id = c.id);

          INSERT INTO privilege_policy (privilege_id, policy_id)
          SELECT pr.id, p.id FROM privilege pr JOIN capability c ON c.id = pr.capability_id JOIN policy p ON p.condition_expression = 'target.status == "PROPOSED"'
          WHERE (c.resource_origin, c.resource, c.operation) = ('DEFMAN', 'ASCRIPTION', 'APPROVE') ON CONFLICT DO NOTHING;

          INSERT INTO role_privilege_assignment (role_id, privilege_id, assigned_at)
          SELECT r.id, pr.id, now() FROM role r JOIN privilege pr ON true JOIN capability c ON c.id = pr.capability_id
          WHERE r.name = 'ITIP_ADMIN' AND (c.resource_origin, c.resource, c.operation) IN (
            ('ITIP', 'ACCOUNT', 'READ'), ('ITIP', 'ACCOUNT', 'CREATE'), ('ITIP', 'ACCOUNT', 'UPDATE'), ('ITIP', 'ACCOUNT', 'DISABLE'), ('DEFMAN', 'DEFINITION', 'CREATE'))
          ON CONFLICT DO NOTHING;

          INSERT INTO role_privilege_assignment (role_id, privilege_id, assigned_at)
          SELECT r.id, pr.id, now() FROM role r JOIN privilege pr ON true JOIN capability c ON c.id = pr.capability_id
          WHERE r.name = 'ITIP_REVIEWER' AND (c.resource_origin, c.resource, c.operation) IN (
            ('DEFMAN', 'ASCRIPTION', 'READ'), ('DEFMAN', 'ASCRIPTION', 'APPROVE'))
          ON CONFLICT DO NOTHING;

          INSERT INTO account_role_assignment (account_id, role_id, assigned_at)
          SELECT a.id, r.id, now() FROM account a JOIN role r ON r.name = 'ITIP_USER'
          WHERE a.email IN ('admin@itip.local', 'reviewer@itip.local')
          ON CONFLICT DO NOTHING;
          INSERT INTO account_role_assignment (account_id, role_id, assigned_at)
          SELECT a.id, r.id, now() FROM account a JOIN role r ON (a.email = 'admin@itip.local' AND r.name = 'ITIP_ADMIN') OR (a.email = 'reviewer@itip.local' AND r.name = 'ITIP_REVIEWER')
          ON CONFLICT DO NOTHING;