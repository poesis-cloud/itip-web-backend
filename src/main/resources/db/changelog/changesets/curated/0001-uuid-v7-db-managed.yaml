# Hand-authored: Liquibase diff cannot generate PL/pgSQL functions or triggers.
# Keeps UUIDv7 generation and enforcement database-owned, never application-owned.
databaseChangeLog:
- changeSet:
    id: 0001-1-enable-pgcrypto
    author: copilot
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE EXTENSION IF NOT EXISTS pgcrypto;

- changeSet:
    id: 0001-2-create-uuid-v7-function
    author: copilot
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE OR REPLACE FUNCTION uuid_v7() RETURNS uuid AS $$
          DECLARE
              v_time BIGINT := (EXTRACT(epoch FROM clock_timestamp()) * 1000)::BIGINT;
              v_bytes bytea;
          BEGIN
              -- 48 bits timestamp (ms) + 80 bits random = 128 bits
              v_bytes := SUBSTRING(int8send(v_time) FROM 3 FOR 6) || gen_random_bytes(10);

              -- Version 7 (bits 48-51 = 0111): byte index 6, high nibble
              v_bytes := set_byte(v_bytes, 6, (get_byte(v_bytes, 6) & 15) | 112);

              -- Variant 10 (bits 64-65): byte index 8, high 2 bits
              v_bytes := set_byte(v_bytes, 8, (get_byte(v_bytes, 8) & 63) | 128);

              RETURN encode(v_bytes, 'hex')::uuid;
          END;
          $$ LANGUAGE plpgsql VOLATILE;

- changeSet:
    id: 0001-3-create-assign-id-trigger-functions
    author: copilot
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE OR REPLACE FUNCTION tgf_assign_id() RETURNS TRIGGER AS $$
          BEGIN
              IF NEW.id IS NULL THEN
                  NEW.id := uuid_v7();
              END IF;
              RETURN NEW;
          END;
          $$ LANGUAGE plpgsql;

          CREATE OR REPLACE FUNCTION tgf_attach_uuid_v7_trigger(p_table_name text) RETURNS void AS $$
          DECLARE
              v_trigger_name text := format('trg_%s_assign_id', p_table_name);
          BEGIN
              EXECUTE format('DROP TRIGGER IF EXISTS %I ON %I', v_trigger_name, p_table_name);
              EXECUTE format(
                  'CREATE TRIGGER %I BEFORE INSERT ON %I FOR EACH ROW EXECUTE FUNCTION tgf_assign_id()',
                  v_trigger_name,
                  p_table_name
              );
          END;
          $$ LANGUAGE plpgsql;

- changeSet:
    id: 0001-4-set-defaults-and-attach-triggers
    author: copilot
    changes:
    - sql:
        splitStatements: false
        sql: |
          -- DEFAULT covers omitted columns; the trigger additionally covers explicit NULL inserts.
          ALTER TABLE account ALTER COLUMN id SET DEFAULT uuid_v7();
          ALTER TABLE role ALTER COLUMN id SET DEFAULT uuid_v7();
          ALTER TABLE capability ALTER COLUMN id SET DEFAULT uuid_v7();
          ALTER TABLE policy ALTER COLUMN id SET DEFAULT uuid_v7();
          ALTER TABLE privilege ALTER COLUMN id SET DEFAULT uuid_v7();
          ALTER TABLE account_role_assignment ALTER COLUMN id SET DEFAULT uuid_v7();
          ALTER TABLE role_privilege_assignment ALTER COLUMN id SET DEFAULT uuid_v7();
          ALTER TABLE privilege_change_audit ALTER COLUMN id SET DEFAULT uuid_v7();

          SELECT tgf_attach_uuid_v7_trigger('account');
          SELECT tgf_attach_uuid_v7_trigger('role');
          SELECT tgf_attach_uuid_v7_trigger('capability');
          SELECT tgf_attach_uuid_v7_trigger('policy');
          SELECT tgf_attach_uuid_v7_trigger('privilege');
          SELECT tgf_attach_uuid_v7_trigger('account_role_assignment');
          SELECT tgf_attach_uuid_v7_trigger('role_privilege_assignment');
          SELECT tgf_attach_uuid_v7_trigger('privilege_change_audit');

- changeSet:
    id: 0001-5-create-uuid-v7-guard-functions
    author: copilot
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE OR REPLACE FUNCTION tgf_reject_non_uuid_v7() RETURNS TRIGGER AS $$
          BEGIN
              -- UUID textual form: xxxxxxxx-xxxx-Mxxx-Nxxx-xxxxxxxxxxxx
              -- v7 -> M='7', RFC variant -> N in {8,9,a,b}
              IF NEW.id IS NULL THEN
                  RETURN NEW;
              END IF;

              IF NEW.id::text !~* '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' THEN
                  RAISE EXCEPTION 'id must be UUIDv7 (got: %)', NEW.id
                      USING ERRCODE = 'check_violation';
              END IF;

              RETURN NEW;
          END;
          $$ LANGUAGE plpgsql;

          CREATE OR REPLACE FUNCTION tgf_attach_uuid_v7_guard_trigger(p_table_name text) RETURNS void AS $$
          DECLARE
              v_trigger_name text := format('trg_%s_reject_non_uuid_v7', p_table_name);
          BEGIN
              EXECUTE format('DROP TRIGGER IF EXISTS %I ON %I', v_trigger_name, p_table_name);
              EXECUTE format(
                  'CREATE TRIGGER %I BEFORE INSERT OR UPDATE OF id ON %I FOR EACH ROW EXECUTE FUNCTION tgf_reject_non_uuid_v7()',
                  v_trigger_name,
                  p_table_name
              );
          END;
          $$ LANGUAGE plpgsql;

- changeSet:
    id: 0001-6-attach-uuid-v7-guard-triggers
    author: copilot
    changes:
    - sql:
        splitStatements: false
        sql: |
          SELECT tgf_attach_uuid_v7_guard_trigger('account');
          SELECT tgf_attach_uuid_v7_guard_trigger('role');
          SELECT tgf_attach_uuid_v7_guard_trigger('capability');
          SELECT tgf_attach_uuid_v7_guard_trigger('policy');
          SELECT tgf_attach_uuid_v7_guard_trigger('privilege');
          SELECT tgf_attach_uuid_v7_guard_trigger('account_role_assignment');
          SELECT tgf_attach_uuid_v7_guard_trigger('role_privilege_assignment');
          SELECT tgf_attach_uuid_v7_guard_trigger('privilege_change_audit');
