# Dev environment values

replicaCount: 1

deployApp: true

image:
  repository: ghcr.io/your-org/itip-web-backend
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: itip-backend.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  DB_URL: jdbc:postgresql://itipdatabase:5432/itip_web_backend
  DB_USER: itip_local
  SPRING_PROFILES_ACTIVE: local
  ITIP_LIQUIBASE_CONTEXTS: dev
  ITIP_SECURITY_PERMIT_ALL: "true"
  ITIP_DEFMAN_BASE_URL: http://sie-definition-manager
  ITIP_DEFMAN_CONNECT_TIMEOUT_MS: "5000"
  ITIP_DEFMAN_READ_TIMEOUT_MS: "10000"
  ITIP_SECURITY_JWT_EXPIRATION_MS: "3600000"

secrets:
  DB_PASSWORD: ""
  ITIP_SECURITY_JWT_SECRET: ""

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

nodeSelector: {}
tolerations: []
affinity: {}
