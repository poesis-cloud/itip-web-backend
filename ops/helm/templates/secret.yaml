{{- if .Values.deployApp }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "itip-web-backend.fullname" . }}-secret
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.DB_PASSWORD is required (inject from CI/CD secret store)" .Values.secrets.DB_PASSWORD | quote }}
  ITIP_SECURITY_JWT_SECRET: {{ required "secrets.ITIP_SECURITY_JWT_SECRET is required (inject from CI/CD secret store)" .Values.secrets.ITIP_SECURITY_JWT_SECRET | quote }}
{{- end }}