{{- if .Values.deployApp }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itip-web-backend.fullname" . }}
  labels:
    app: {{ include "itip-web-backend.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "itip-web-backend.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "itip-web-backend.fullname" . }}
    spec:
      containers:
        - name: itip-web-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: OIDC_ISSUER_URI
              value: {{ .Values.env.OIDC_ISSUER_URI | quote }}
            - name: SIE_DM_BASE_URL
              value: {{ .Values.env.SIE_DM_BASE_URL | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
