{{- if .Values.deployApp }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itip-web-backend.fullname" . }}
  labels:
    app: {{ include "itip-web-backend.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "itip-web-backend.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "itip-web-backend.fullname" . }}
    spec:
      containers:
        - name: itip-web-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: {{ .Values.env.DB_URL | quote }}
            - name: DB_USER
              value: {{ .Values.env.DB_USER | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "itip-web-backend.fullname" . }}-secret
                  key: DB_PASSWORD
            {{- if .Values.env.SPRING_PROFILES_ACTIVE }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.SPRING_PROFILES_ACTIVE | quote }}
            {{- end }}
            - name: ITIP_SECURITY_PERMIT_ALL
              value: {{ .Values.env.ITIP_SECURITY_PERMIT_ALL | quote }}
            - name: ITIP_SECURITY_JWT_EXPIRATION_MS
              value: {{ .Values.env.ITIP_SECURITY_JWT_EXPIRATION_MS | quote }}
            - name: ITIP_SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "itip-web-backend.fullname" . }}-secret
                  key: ITIP_SECURITY_JWT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
