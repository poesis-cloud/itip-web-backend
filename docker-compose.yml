services:
  postgres:
    image: postgres:17
    container_name: itip-web-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itip_web_backend}
      POSTGRES_USER: ${POSTGRES_USER:-itip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itip}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itip} -d ${POSTGRES_DB:-itip_web_backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itip-web-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-itip_web_backend}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-itip}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-itip}
      SPRING_LIQUIBASE_ENABLED: "true"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-data: